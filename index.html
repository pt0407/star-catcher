<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07132f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Star Catcher - a tiny arcade game. Catch the stars, dodge the rocks.">
  <meta property="og:title" content="Star Catcher">
  <meta property="og:description" content="Catch the stars, dodge the rocks. A tiny arcade game.">
  <meta property="og:type" content="website">
  <title>Star Catcher</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Star Catcher</h1>
  <canvas id="game" width="400" height="600" role="img" aria-label="Star Catcher game canvas"></canvas>
  <noscript><p>This game needs JavaScript turned on.</p></noscript>
  <p>Arrow keys or A/D to move, or touch and drag on the canvas. P pauses, M mutes, N night mode, F fps, 1/2/3 difficulty. Catch stars, dodge rocks.</p>
  <script src="game.js"></script>
</body>
</html>
