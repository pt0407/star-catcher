<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07132f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Star Catcher - a tiny arcade game. Catch the stars, dodge the rocks.">
  <meta property="og:title" content="Star Catcher">
  <meta property="og:description" content="Catch the stars, dodge the rocks. A tiny arcade game.">
  <meta property="og:type" content="website">
  <title>Star Catcher</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/background.png" as="image">
  <link rel="preload" href="assets/star.png" as="image">
  <link rel="preload" href="assets/logo.png" as="image">
  <link rel="preload" href="assets/player.png" as="image">
  <link rel="preload" href="assets/rock.png" as="image">
  <link rel="preload" href="assets/heart.png" as="image">
  <link rel="preload" href="assets/magnet.png" as="image">
  <link rel="preload" href="assets/player_sheet.png" as="image">
  <link rel="preload" href="assets/star_sheet.png" as="image">
  <link rel="preload" href="assets/rock_sheet.png" as="image">
  <link rel="preload" href="assets/heart_sheet.png" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Star Catcher</h1>
  <canvas id="game" width="400" height="600" role="img" aria-label="Star Catcher game canvas. Arrow keys or A/D to move, space to start" aria-describedby="hint"></canvas>
  <noscript><p>This game needs JavaScript turned on.</p></noscript>
  <p id="hint">Arrow keys or A/D to move, or touch and drag on the canvas. P pauses, M mutes, shift+M music, N night mode, F fps, 1/2/3 difficulty, [ ] volume, , . music volume. Catch stars, dodge rocks. Grab magnets and hearts when you can.</p>
  <div id="touch-controls" aria-hidden="true"><button id="touch-left" type="button">&#9664;</button><button id="touch-right" type="button">&#9654;</button></div>
  <script type="module" src="game.js"></script>
</body>
</html>
